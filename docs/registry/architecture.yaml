# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: json_parsing
    status: active
    api: "JSON.new().parse(text) inside DataLoader only"
    not: ".tres resources, load(), JSON.parse_string outside DataLoader"
    adr: docs/architecture/adr-0002-data-format-effect-schema-config-loading.md
    reason: "Instance form exposes error line/message for E_PARSE; one parser avoids per-system loaders (TD-008)"
    referenced_by:
      - docs/architecture/adr-0002-data-format-effect-schema-config-loading.md
    added: 2026-11-03
    revised: ""

  - purpose: data_fingerprint
    status: active
    api: "HashingContext HASH_SHA256 over canonical JSON.stringify(body, '', true, true), first 16 hex"
    not: "authored content-version strings"
    adr: docs/architecture/adr-0002-data-format-effect-schema-config-loading.md
    reason: "Derived data_version (CR-9) feeds RngService and RunRecord"
    referenced_by:
      - docs/architecture/adr-0002-data-format-effect-schema-config-loading.md
      - docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
    added: 2026-11-03
    revised: ""

  - purpose: rng_generator
    status: active
    api: "One RandomNumberGenerator per named RngStream, seeded by FNV-1a 64 + SplitMix64"
    not: "global randi/randf/randomize, Array.shuffle, pick_random under src/gameplay or src/ai"
    adr: docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
    reason: "Reproducible runs (Pillar 4, TD-007); restore by reseed-and-discard"
    referenced_by:
      - docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
      - docs/architecture/adr-0007-effect-resolver-validator-boundary.md
    added: 2026-11-03
    revised: ""

  - purpose: persisted_int64
