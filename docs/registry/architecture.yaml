    revised: ""

  - purpose: atomic_rename
    status: active
    api: "AtomicFileWriter: tmp, flush/close, size check, rename json to bak, DirAccess.rename_absolute tmp to absent json"
    not: "FileAccess WRITE on the final path; rename over an existing target"
    adr: docs/architecture/adr-0004-save-format-and-atomic-profile-write.md
    reason: "Previous good copy always survives; Windows semantics gated by atomic_write_platform_test"
    referenced_by:
      - docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
      - docs/architecture/adr-0004-save-format-and-atomic-profile-write.md
    added: 2026-11-03
    revised: ""

  - purpose: planner_threading
    status: active
    api: "WorkerThreadPool.add_task + is_task_completed per tick + wait_for_task_completion once (WorkerPoolPlannerTask)"
    not: "dedicated Thread; worker over the live engine; time-slicing except as data-selected fallback"
    adr: docs/architecture/adr-0006-boss-ai-planner-threading.md
    reason: "Probe A: deterministic, 70-90 ms off-thread; time-slicing overshoots 2 ms with large chunks"
    referenced_by:
      - docs/architecture/adr-0006-boss-ai-planner-threading.md
      - docs/architecture/adr-0008-match-driver-ownership-and-handoff.md
    added: 2026-11-03
    revised: ""

  - purpose: ui_animation
    status: active
    api: "Tween created and killed by presenters; Control.offset_transform_* for lifts in containers"
    not: "AnimationPlayer / AnimationTree for data-driven steps"
    adr: docs/architecture/adr-0009-match-ui-animation-queue-and-scene-partition.md
    reason: "Queue owns timing, presenters own visuals; skip-all and coalescing need code-built tweens"
    referenced_by:
      - docs/architecture/adr-0009-match-ui-animation-queue-and-scene-partition.md
      - docs/architecture/adr-0011-run-ui-shell-and-meta-stub-seam.md
    added: 2026-11-03
    revised: ""

  - purpose: evidence_capture
    status: active
    api: "tools/capture.sh: xvfb-run + --rendering-driver opengl3 + --write-movie, last frame kept"
    not: "--headless --write-movie (crashes, exit 134); relying on silent Vulkan fallback"
    adr: docs/architecture/adr-0010-renderer-choice-vs-xvfb-screenshot-capture.md
    reason: "CI has no GPU or Vulkan ICD; shipped Windows build stays Forward+"
    referenced_by:
      - docs/architecture/adr-0009-match-ui-animation-queue-and-scene-partition.md
      - docs/architecture/adr-0010-renderer-choice-vs-xvfb-screenshot-capture.md
