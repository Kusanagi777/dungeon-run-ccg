# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: node_in_rules_tier
    status: active
    description: "Nothing under src/gameplay/ or src/ai/ extends Node or references a Node, autoload or scene"
    why: "TD-001/TD-005: rules bound to the scene tree cannot run headless or be tested"
    adr: docs/architecture/adr-0001-rules-presentation-split.md
    added: 2026-11-03

  - pattern: second_autoload
    status: active
    description: "Boot is the only autoload; it owns no game state and only scene roots and debug loaders call it"
    why: "TD-001 god-object singleton"
    adr: docs/architecture/adr-0001-rules-presentation-split.md
    added: 2026-11-03

  - pattern: resolver_direct_state_write
    status: active
    description: "src/gameplay/effects/** writes match state only through engine primitives (grep gate G7)"
    why: "One event per mutation; TD-002/TD-004"
    adr: docs/architecture/adr-0007-effect-resolver-validator-boundary.md
    added: 2026-11-03

  - pattern: engine_signal_connected_in_production
    status: active
    description: "RulesEngine.match_ended is never connected outside tests; MatchDriver emits its own match_ended"
    why: "Run Structure must hear match end first and after subscribers"
    adr: docs/architecture/adr-0008-match-driver-ownership-and-handoff.md
    added: 2026-11-03

  - pattern: worker_touches_live_engine
    status: active
    description: "A PlannerTask works only on RulesEngine.clone(); never the live engine, live EventLog, driver, a Node or Boot"
    why: "Live appends and signals must stay on the main thread; forecast runs while the player acts"
    adr: docs/architecture/adr-0006-boss-ai-planner-threading.md
    added: 2026-11-03

  - pattern: subscriber_off_main_thread
    status: active
    description: "EventLog subscribers run only on the main thread; no worker appends to or subscribes to a live log"
    why: "UI code must never run off-thread"
    adr: docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
    added: 2026-11-03

  - pattern: global_rng_in_rules
    status: active
    description: "No randi, randf, randomize, Array.shuffle, pick_random or RandomNumberGenerator.new under src/gameplay or src/ai"
    why: "TD-007 unseeded randomness; breaks replay"
    adr: docs/architecture/adr-0003-seeded-rng-service-and-event-log.md
    added: 2026-11-03

  - pattern: json_parse_outside_card_database
    status: active
    description: "No FileAccess.open, JSON parse or load() of res://assets/data outside CardDatabase/DataLoader (tools/content/validate.gd excepted)"
    why: "One loader, one validation pipeline (TD-008)"
    adr: docs/architecture/adr-0002-data-format-effect-schema-config-loading.md
    added: 2026-11-03

  - pattern: global_modifier_singleton
    status: active
    description: "No ModifierManager-style global registry; hooks live per match on MatchState.hooks"
    why: "TD-009 modifier half: unscoped, global, back-referencing"
    adr: docs/architecture/adr-0005-owner-scoped-hook-registry.md
    added: 2026-11-03

  - pattern: hook_priority_field
    status: active
    description: "No priority, weight or order field and no sort on hook entries; installation order only"
    why: "Undefined ties in the prototype; tray order must equal evaluation order"
    adr: docs/architecture/adr-0005-owner-scoped-hook-registry.md
    added: 2026-11-03

  - pattern: hook_back_reference
    status: active
    description: "HookEntry/HookInstaller hold no reference to the registry, engine, log or a Node"
    why: "TD-009 self-removing modifier calling the singleton"
    adr: docs/architecture/adr-0005-owner-scoped-hook-registry.md
    added: 2026-11-03

  - pattern: clamp_inside_fold
    status: active
    description: "Value hooks are clamped once by the engine after the whole fold, never per entry"
    why: "Per-entry clamping changes results (1-1-1 must give 0 via -1)"
    adr: docs/architecture/adr-0005-owner-scoped-hook-registry.md
    added: 2026-11-03

  - pattern: direct_write_to_final_user_path
    status: active
    description: "No FileAccess WRITE on user://profile.json or user://logs/** finals; only AtomicFileWriter"
    why: "A crash mid-write would destroy the last good copy"
    adr: docs/architecture/adr-0004-save-format-and-atomic-profile-write.md
    added: 2026-11-03

  - pattern: headless_write_movie
    status: active
    description: "Evidence capture never uses --headless --write-movie"
    why: "Observed crash (exit 134) on 4.7.2"
    adr: docs/architecture/adr-0010-renderer-choice-vs-xvfb-screenshot-capture.md
    added: 2026-11-03

  - pattern: forward_plus_only_effects_v1
    status: active
    description: "v1 UI uses only the renderer-neutral subset; no Forward+-only effects"
    why: "CI evidence renders on Compatibility; the two paths must stay equivalent"
    adr: docs/architecture/adr-0010-renderer-choice-vs-xvfb-screenshot-capture.md
    added: 2026-11-03

  - pattern: tween_ends_a_step
    status: active
    description: "An AnimStep ends on the queue's timer, never on Tween.finished or a presenter signal"
    why: "Skip-all and the idle invariant need timing owned in one place"
    adr: docs/architecture/adr-0009-match-ui-animation-queue-and-scene-partition.md
    added: 2026-11-03

  - pattern: screen_holds_run_state
    status: active
    description: "Run UI screens hold no run data and never use set_meta/get_meta; RunController is the only talker"
    why: "TD-009 run state in set_meta strings on nodes"
    adr: docs/architecture/adr-0011-run-ui-shell-and-meta-stub-seam.md
    added: 2026-11-03
