# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: collectible_pool_size
    status: active
    source: design/gdd/card-database.md
    referenced_by:
      - design/gdd/card-database.md
      - design/gdd/card-effects.md
    variables:
      - n_nontoken_hero_set
      - n_nontoken_neutral
    output_range: [0, 400]
    expression: "n_nontoken(hero_set) + n_nontoken(neutral)"
    notes: "~70 per hero at v1, ~40 at MVP."
    added: 2026-11-03
    revised: ""
  - name: min_treasure_pool
    status: active
    source: design/gdd/card-database.md
    referenced_by:
      - design/gdd/card-database.md
